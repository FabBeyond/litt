[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "litt"
version = "0.3.0"
description = "Display lyrics of playing song in terminal"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "rich==15.0.0",
  "simple-term-menu==1.6.6",
  "pyfiglet==1.0.4",
  "syncedlyrics==1.0.1",
  "pillow==12.3.0"
]

[project.scripts]
litt = "litt.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/litt"]
